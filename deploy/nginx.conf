server {
    listen [::]:8084 ipv6only=on;
    server_name dawid220-8084.mikrus.cloud;

    root /srv/s01e04-preview;
    default_type text/html;
    charset utf-8;
    server_tokens off;
    autoindex off;

    # The reviewer must see the current marker state after an atomic replacement.
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files /index.html =404;
    }

    location / {
        return 404;
    }
}
